        /* ===== Animations ===== */
        @keyframes pulse-slow { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
        .animate-pulse-slow { animation: pulse-slow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pop { 0% { transform: scale(0.88); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .animate-pop { animation: pop 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) both; }
        @keyframes slide-up { from { transform: translateY(18px); opacity:0; } to { transform: translateY(0); opacity:1; } }
        .animate-slide-up { animation: slide-up 0.3s ease-out forwards; }
        @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .animate-spin-slow { animation: spin-slow 3s linear infinite; }
        @keyframes shine { from{background-position:-200% 0} to{background-position:200% 0} }
        @keyframes twinkle { 0%,100%{opacity:.2} 50%{opacity:.8} }

        .cursor-grab { cursor: grab; }
        .cursor-grabbing { cursor: grabbing; }

        main .rounded-3xl .text-emerald-800 { color: #065F46 !important; }

        main h2.font-bold,

        .schedule-row:hover td { background-color: #EFF6FF !important; }

        .schedule-active td:last-child { border-right: 2px solid #3B82F6 !important; }

        .bg-grid-pattern {

        ::-webkit-scrollbar-thumb { background: #93C5FD; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #3B82F6; }

                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                const rect = e.currentTarget.getBoundingClientRect();
                const offsetX = clientX - rect.left; const offsetY = clientY - rect.top;
                
                setDraggingInfo({ id, offsetX, offsetY, width: rect.width, height: rect.height });
                setDragPos({ x: rect.left, y: rect.top });
                
                const onPointerMove = (moveEvent) => {
                    const mX = moveEvent.touches ? moveEvent.touches[0].clientX : moveEvent.clientX;
                    const mY = moveEvent.touches ? moveEvent.touches[0].clientY : moveEvent.clientY;
                    setDragPos({ x: mX - offsetX, y: mY - offsetY });
                };

                const onPointerUp = (upEvent) => {
                    const mX = upEvent.changedTouches ? upEvent.changedTouches[0].clientX : upEvent.clientX;
                    const mY = upEvent.changedTouches ? upEvent.changedTouches[0].clientY : upEvent.clientY;
                    if (seatingContainerRef.current) {
                        const containerRect = seatingContainerRef.current.getBoundingClientRect();
                        const relX = mX - containerRect.left; const relY = mY - containerRect.top;
                        const cellW = containerRect.width / 6; const cellH = containerRect.height / 6;
                        let targetCol = Math.max(0, Math.min(5, Math.floor(relX / cellW)));
                        let targetRow = Math.max(0, Math.min(5, Math.floor(relY / cellH)));
                        
                        setSeatPositions(prev => {
                            const next = { ...prev };
                            const origPos = prev[id] || {col:0, row:0};
                            const occupantId = Object.keys(next).find(k => next[k].col === targetCol && next[k].row === targetRow);
                            if (occupantId && occupantId !== id.toString()) next[occupantId] = origPos;
                            next[id] = { col: targetCol, row: targetRow };
                            return next;
                        });
                    }
                    setDraggingInfo(null);
                    document.removeEventListener('mousemove', onPointerMove);
                    document.removeEventListener('mouseup', onPointerUp);
                    document.removeEventListener('touchmove', onPointerMove);
                    document.removeEventListener('touchend', onPointerUp);
                };
                document.addEventListener('mousemove', onPointerMove);
                document.addEventListener('mouseup', onPointerUp);
                document.addEventListener('touchmove', onPointerMove, { passive: false });
                document.addEventListener('touchend', onPointerUp);
            };

                const handleMouseMove = (moveEvent) => {
                    const newX = moveEvent.clientX - offsetX; const newY = moveEvent.clientY - offsetY;
                    const maxX = window.innerWidth - rect.width; const maxY = window.innerHeight - rect.height;
                    setVolPos({ left: Math.max(0, Math.min(newX, maxX)), top: Math.max(0, Math.min(newY, maxY)) });
                };
                const handleMouseUp = () => { document.removeEventListener('mousemove', handleMouseMove); document.removeEventListener('mouseup', handleMouseUp); };
                document.addEventListener('mousemove', handleMouseMove); document.addEventListener('mouseup', handleMouseUp);
            };

            const volumeLevels = [
                { id: 0, title: "絕對安靜", desc: "測驗/午休", color: "bg-red-500", textColor: "text-red-600", borderColor: "border-red-500", icon: Icons.VolumeX, btnIcon: Icons.VolumeX },
                { id: 1, title: "輕聲細語", desc: "閱讀/討論", color: "bg-amber-400", textColor: "text-amber-600", borderColor: "border-amber-400", icon: Icons.Volume1, btnIcon: Icons.Volume1 },
                { id: 2, title: "一般音量", desc: "下課/互動", color: "bg-emerald-500", textColor: "text-emerald-600", borderColor: "border-emerald-500", icon: Icons.Users, btnIcon: Icons.Users },
                { id: 3, title: "公開發表", desc: "報告/戶外", color: "bg-sky-500", textColor: "text-sky-600", borderColor: "border-sky-500", icon: Icons.Mic, btnIcon: Icons.Mic }
            ];
            const currentVolConfig = volumeLevels[currentLevel];

            const activeHomeworks = homeworks.filter(hw => hw.title.trim() !== "");
            const freeStudents = studentData.filter((student, index) => {
                const hasDebt = outstandingHomeworks.some(debt => debt.studentId === student.id);
                if (hasDebt) return false;
                const hasIncompleteReflection = selfReflections.some(sr => sr.studentId === student.id && !sr.isCompleted);
                if (hasIncompleteReflection) return false;
                if (activeHomeworks.length === 0) return true;
                return activeHomeworks.every(hw => hw.status[index] === 2);
            });

            const groupedDebts = useMemo(() => {
                const groups = {};
                outstandingHomeworks.forEach(debt => {
                    if (!groups[debt.studentId]) groups[debt.studentId] = { studentName: debt.studentName, debts: [] };
                    groups[debt.studentId].debts.push(debt);
                });
                return groups;
            }, [outstandingHomeworks]);

            const warningDebts = useMemo(() => {
                const oneDayMs = 1000 * 3600 * 24; const now = Date.now();
                return outstandingHomeworks.filter(d => Math.floor((now - (d.timestamp || now)) / oneDayMs) >= 2);
            }, [outstandingHomeworks, currentTime]);
            
            // 分組工具：依模式產生分組
            const generateGroups = () => {
                const students = [...studentData];
                if (students.length === 0) { alert("目前沒有學生資料。"); return; }
                let count = groupBy === 'size' ? Math.max(1, Math.ceil(students.length / Math.max(1, groupSize))) : Math.max(1, Math.min(groupCount, students.length));
                let ordered;
                if (groupMode === 'random') {
                    ordered = students.slice();
                    for (let i = ordered.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [ordered[i], ordered[j]] = [ordered[j], ordered[i]]; }
                } else {
                    ordered = students.sort((a, b) => b.score - a.score);
                }
                const groups = Array.from({ length: count }, () => []);
                if (groupMode === 'homo') {
                    const per = Math.ceil(ordered.length / count);
                    ordered.forEach((s, i) => groups[Math.min(count - 1, Math.floor(i / per))].push(s));
                } else if (groupMode === 'hetero') {
                    ordered.forEach((s, i) => {
                        const round = Math.floor(i / count); const pos = i % count;
                        const idx = round % 2 === 0 ? pos : count - 1 - pos;
                        groups[idx].push(s);
                    });
                } else {
                    ordered.forEach((s, i) => groups[i % count].push(s));
                }
                setSavedGroups(groups.filter(g => g.length > 0));
            };

            // 互動黑板：便利貼
            const BOARD_COLORS = ['#fde68a', '#bfdbfe', '#bbf7d0', '#fecaca', '#e9d5ff', '#fed7aa'];
            const addBoardNote = () => {
                setBoardNotes(prev => [...prev, { id: Date.now() + Math.random(), text: '點我編輯…', x: 40 + (prev.length % 5) * 24, y: 40 + (prev.length % 5) * 24, color: BOARD_COLORS[prev.length % BOARD_COLORS.length] }]);
            };
            const updateBoardNote = (id, patch) => setBoardNotes(prev => prev.map(n => n.id === id ? { ...n, ...patch } : n));
            const deleteBoardNote = (id) => setBoardNotes(prev => prev.filter(n => n.id !== id));
            const handleNotePointerDown = (e, id) => {
                if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'BUTTON') return;
                if (e.cancelable) e.preventDefault();
                const startX = e.touches ? e.touches[0].clientX : e.clientX;
                const startY = e.touches ? e.touches[0].clientY : e.clientY;
                const note = boardNotes.find(n => n.id === id);
                const baseX = note ? note.x : 0; const baseY = note ? note.y : 0;
                setDraggingNote(id);
                const onMove = (mv) => {
                    const mX = mv.touches ? mv.touches[0].clientX : mv.clientX;
                    const mY = mv.touches ? mv.touches[0].clientY : mv.clientY;
                    const nx = Math.max(0, baseX + (mX - startX));
                    const ny = Math.max(0, baseY + (mY - startY));
                    setBoardNotes(prev => prev.map(n => n.id === id ? { ...n, x: nx, y: ny } : n));
                };
                const onUp = () => {
                    setDraggingNote(null);
                    document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp);
                    document.removeEventListener('touchmove', onMove); document.removeEventListener('touchend', onUp);
                };
                document.addEventListener('mousemove', onMove); document.addEventListener('mouseup', onUp);
                document.addEventListener('touchmove', onMove, { passive: false }); document.addEventListener('touchend', onUp);
            };

            // QR Code：學生寵物頁 URL
            const STUDENT_PAGE_BASE = 'https://oran106-png.github.io/Dashboard/student.html';
            const buildQrData = (s) => `${STUDENT_PAGE_BASE}?id=${s.id}`;

            // 雲端：初始化 Firebase
            const initCloud = (configText) => {
                if (typeof firebase === 'undefined') { setCloudStatus("❌ Firebase 函式庫尚未載入，請檢查網路連線。"); return false; }
                let config;
                try { config = normalizeFirebaseConfig(configText); }
                catch (e) { setCloudStatus("❌ 設定格式錯誤，請貼上完整的 firebaseConfig 物件。"); return false; }
                if (!config.apiKey || !config.projectId) { setCloudStatus("❌ 設定缺少 apiKey 或 projectId。"); return false; }
                try {
                    if (!firebase.apps.length) firebase.initializeApp(config);
                    cloudAuthRef.current = firebase.auth();
                    cloudDbRef.current = firebase.firestore();
                    cloudAuthRef.current.onAuthStateChanged((user) => {
                        if (user) {
                            setCloudUser({ uid: user.uid, displayName: user.displayName || "老師", email: user.email || "", photoURL: user.photoURL || "" });
                            setCloudStatus(`✅ 已登入：${user.displayName || user.email}。可上傳或還原資料。`);
                            // 監聽 portal：學生抽寵物後自動同步回老師端
                            cloudDbRef.current.collection('portal').doc('class502').onSnapshot(snap => {
                                if (!snap.exists) return;
                                const portalStudents = snap.data().students || [];
                                setPetAssignments(prev => {
                                    const next = { ...prev };
                                    let changed = false;
                                    portalStudents.forEach(ps => {
                                        if (ps.petLineId && ps.petLineId !== (prev[ps.id] || 0)) {
                                            next[ps.id] = ps.petLineId;
                                            changed = true;
                                        }
                                    });
                                    if (changed) localStorage.setItem('class502_pet_assignments_v1', JSON.stringify(next));
                                    return changed ? next : prev;
                                });
                                // 同步扣分（學生抽寵物花的 5 分）
                                setStudentData(prev => {
                                    const next = prev.map(s => {
                                        const ps = portalStudents.find(p => p.id === s.id);
                                        if (ps && ps.score !== s.score && ps.petLineId && !prev.find(p=>p.id===s.id)?.petLineId) {
                                            return { ...s, score: ps.score };
                                        }
                                        return s;
                                    });
                                    return next;
                                });
                            });
                        } else { setCloudUser(null); setCloudStatus("尚未登入，請按 Google 登入。"); }
                    });
                    setCloudReady(true);
                    return true;
                } catch (e) { setCloudStatus(`❌ 初始化失敗：${e.message}`); return false; }
            };

            const saveAndInitCloud = () => {
                if (initCloud(cloudConfigText)) {
                    localStorage.setItem('class502_cloud_config', cloudConfigText);
                    setCloudStatus("✅ 雲端設定已儲存並啟用，請按 Google 登入。");
                }
            };

            const cloudLogin = async () => {
                if (!cloudAuthRef.current) { setCloudStatus("請先儲存並啟用雲端設定。"); return; }
                setCloudBusy(true);
                try {
                    const provider = new firebase.auth.GoogleAuthProvider();
                    provider.setCustomParameters({ prompt: 'select_account' });
                    await cloudAuthRef.current.signInWithPopup(provider);
                } catch (e) { setCloudStatus(`❌ 登入失敗：${e.message}`); } finally { setCloudBusy(false); }
            };

            const cloudLogout = async () => {
                if (!cloudAuthRef.current) return;
                try { await cloudAuthRef.current.signOut(); } catch (e) {}
            };

            const pushToCloud = async (silent) => {
                if (!cloudDbRef.current || !cloudUser) { if (!silent) setCloudStatus("請先登入再上傳。"); return; }
                if (!silent) setCloudBusy(true);
                try {
                    const payload = {};
                    CLOUD_KEYS.forEach(k => { const v = localStorage.getItem(k); if (v !== null) payload[k] = v; });
                    await cloudDbRef.current.collection('classManager').doc(cloudUser.uid).set({
                        payload, updatedAt: new Date().toISOString(), className: classNameTitle
                    });
                    // 同步學生頁 portal（公開可讀）
                    const curStudents = JSON.parse(localStorage.getItem('class502_student_data_v8') || '[]');
                    const curAssign = JSON.parse(localStorage.getItem('class502_pet_assignments_v1') || '{}');
                    const freeIds = new Set(freeStudents.map(s => s.id));
                    if (curStudents.length) {
                        await cloudDbRef.current.collection('portal').doc('class502').set({
                            students: curStudents.map(s => ({ id: s.id, name: s.name, score: s.score, petLineId: curAssign[s.id] || 0, isFree: freeIds.has(s.id) })),
                            updatedAt: new Date().toISOString()
                        }, { merge: true });
                    }
                    await cloudDbRef.current.collection('portal').doc('class502_ext').set({
                        homeworksJson:   localStorage.getItem('class502_homeworks_v10') || '[]',
                        debtsJson:       localStorage.getItem('class502_outstanding_hw_v2') || '[]',
                        reflectionsJson: localStorage.getItem('class502_self_reflections_v1') || '[]',
                        updatedAt:       new Date().toISOString()
                    });
                    setCloudStatus(`☁️ 已於 ${new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', second: '2-digit' })} 上傳到雲端。`);
                } catch (e) { setCloudStatus(`❌ 上傳失敗：${e.message}`); } finally { if (!silent) setCloudBusy(false); }
            };

            const pullFromCloud = async () => {
                if (!cloudDbRef.current || !cloudUser) { setCloudStatus("請先登入再還原。"); return; }
                if (!confirm("從雲端還原會【覆蓋本機目前的資料】，確定要繼續嗎？")) return;
                setCloudBusy(true);
                try {
                    const snap = await cloudDbRef.current.collection('classManager').doc(cloudUser.uid).get();
                    if (!snap.exists) { setCloudStatus("雲端尚無備份資料。"); setCloudBusy(false); return; }
                    const data = snap.data();
                    if (data && data.payload) {
                        Object.keys(data.payload).forEach(k => { if (CLOUD_KEYS.indexOf(k) > -1) localStorage.setItem(k, data.payload[k]); });
                        setCloudStatus("✅ 已從雲端還原，畫面即將重新載入…");
                        setTimeout(() => location.reload(), 1200);
                    } else { setCloudStatus("雲端資料格式異常。"); setCloudBusy(false); }
                } catch (e) { setCloudStatus(`❌ 還原失敗：${e.message}`); setCloudBusy(false); }
            };

            // 載入已儲存的雲端設定並初始化（僅一次）
            useEffect(() => {
                const cfg = localStorage.getItem('class502_cloud_config') || DEFAULT_FIREBASE_CONFIG;
                const auto = localStorage.getItem('class502_cloud_autosync');
                if (auto !== null) setCloudAutoSync(auto === 'true');
                setCloudConfigText(cfg);
                initCloud(cfg);
            }, []);
            useEffect(() => { if (isLoaded) localStorage.setItem('class502_cloud_autosync', cloudAutoSync ? 'true' : 'false'); }, [cloudAutoSync, isLoaded]);
            // 自動上傳：資料變動後 4 秒上傳（登入且開啟自動同步時）
            useEffect(() => {
                if (!isLoaded || !cloudUser || !cloudAutoSync) return;
                const t = setTimeout(() => pushToCloud(true), 4000);
                return () => clearTimeout(t);
            }, [studentData, homeworks, outstandingHomeworks, scoreHistory, rewardsList, redeemHistory, behaviorRecords, selfReflections, seatPositions, examSchedule, petNames, savedGroups, boardNotes, boardHeading, moduleConfig, cloudUser, cloudAutoSync, isLoaded]);

            // 動態過濾底部導覽列 (只顯示開啟的模組)
            const availableTabs = [
                { id: 'dashboard', label: '儀表板', icon: Icons.LayoutDashboard, color: 'text-blue-600', bg: 'bg-blue-50', visible: true },
                { id: 'exam', label: '考試模式', icon: Icons.ClipboardList, color: 'text-blue-600', bg: 'bg-blue-50', visible: moduleConfig.tabExam },
                { id: 'seats', label: '座位表', icon: Icons.Grid, color: 'text-blue-600', bg: 'bg-blue-50', visible: moduleConfig.tabSeats },
                { id: 'score', label: '積分榜', icon: Icons.Trophy, color: 'text-blue-600', bg: 'bg-blue-50', visible: moduleConfig.tabScore },
                { id: 'redeem', label: '福利社', icon: Icons.Gift, color: 'text-blue-600', bg: 'bg-blue-50', visible: moduleConfig.tabRedeem },
                { id: 'records', label: '行為紀錄', icon: Icons.FileMinus2, color: 'text-blue-600', bg: 'bg-blue-50', visible: moduleConfig.tabRecords },
                { id: 'pets', label: '寵物養成', icon: Icons.PawPrint, color: 'text-blue-600', bg: 'bg-blue-50', visible: moduleConfig.tabPets },
                { id: 'groups', label: '分組工具', icon: Icons.Shuffle, color: 'text-blue-600', bg: 'bg-blue-50', visible: moduleConfig.tabGroups },
                { id: 'board', label: '互動黑板', icon: Icons.Edit, color: 'text-blue-600', bg: 'bg-blue-50', visible: moduleConfig.tabBoard },
                { id: 'essay', label: '作文批改', icon: Icons.BookOpen, color: 'text-blue-600', bg: 'bg-blue-50', visible: moduleConfig.tabEssay },
                { id: 'qr', label: '學生QR', icon: Icons.QrCode, color: 'text-blue-600', bg: 'bg-blue-50', visible: moduleConfig.tabQR },
            ].filter(tab => tab.visible !== false);

            return (
                <div className="min-h-screen text-slate-800 flex flex-col pb-24">
                    {/* Header */}
                    <header className="rpg-header p-3 sticky top-0 z-30 flex justify-between items-center">
                        <div className="flex items-center gap-3">
                            <div className="rpg-school-icon p-2 rounded-xl shadow-md">
                                <Icon component={Icons.School} size={24} />
                            </div>
                            <input type="text" value={classNameTitle} onChange={(e) => setClassNameTitle(e.target.value)} className="rpg-title-input bg-transparent font-black text-xl w-36 focus:outline-none" />
                        </div>
                        <div className="flex items-center gap-2">
                             <div className="hidden md:flex flex-col items-end mr-2">
                                <span className="rpg-clock-label text-xs font-bold">Today</span>
                                <span className="rpg-clock text-lg font-mono font-bold leading-none">{currentTime.toLocaleTimeString('zh-TW', {hour12:false, hour:'2-digit', minute:'2-digit'})}</span>
                            </div>
                            <button onClick={() => setShowCloudModal(true)} className="rpg-icon-btn border px-3 py-2 rounded-xl transition-colors flex items-center gap-2 font-bold text-sm" title="雲端同步">
                                {cloudUser && cloudUser.photoURL ? <img src={cloudUser.photoURL} alt="" className="w-5 h-5 rounded-full" /> : <Icon component={Icons.Cloud} size={18} />}
                                <span className="hidden sm:inline">{cloudUser ? '已連雲端' : '雲端'}</span>
                            </button>
                            <button onClick={() => setShowSettingsModal(true)} className="rpg-icon-btn border px-3 py-2 rounded-xl transition-colors flex items-center gap-2 font-bold text-sm" title="模組設定">
                                <Icon component={Icons.Settings} size={18} />
                                <span className="hidden sm:inline">模組設定</span>
                            </button>
                            <button onClick={() => toggleBell(1)} title="單響模式" className={`p-2 rounded-xl shadow-lg hover:scale-105 transition-all text-white font-bold text-xs flex flex-col items-center ${bellMode === 1 ? 'bg-amber-500 animate-pulse-slow' : 'bg-slate-500 hover:bg-amber-400'}`}>
                                <Icon component={Icons.Bell} size={20} />
                            </button>
                            <button onClick={() => toggleBell(2)} title="連響模式" className={`p-2 rounded-xl shadow-lg hover:scale-105 transition-all text-white font-bold text-xs flex flex-col items-center ${bellMode === 2 ? 'bg-red-500 animate-pulse-slow' : 'bg-slate-500 hover:bg-red-400'}`}>
                                <Icon component={Icons.BellRing} size={20} />
                            </button>
                            <button onClick={() => setShowAIModal(true)} className="rpg-ai-btn text-white p-2 rounded-xl shadow-lg hover:scale-105 transition-transform"><Icon component={Icons.Sparkles} size={20} /></button>
                        </div>
                    </header>

                    {/* 懸浮音量標準 (可拖曳) */}
                    {moduleConfig.volumeWidget && (
                    <div 
                        className={`fixed z-30 flex flex-col gap-2 transition-all duration-75 ${volPos ? '' : 'right-0 md:right-4 top-24'}`}
                        style={volPos ? { left: volPos.left, top: volPos.top } : {}}
                    >
                        <div className={`rpg-vol-widget border-2 ${currentVolConfig.borderColor} shadow-xl rounded-2xl p-3 flex flex-col items-center gap-3 w-16 md:w-20 transition-all relative group`}>
                            <div onMouseDown={handleVolMouseDown} className="absolute -top-3 -left-3 bg-white border border-slate-200 rounded-full p-1.5 shadow-md cursor-grab active:cursor-grabbing text-slate-400 hover:text-blue-500 transition-colors opacity-0 group-hover:opacity-100" title="拖曳移動">
                                <Icon component={Icons.Move} size={14} />
                            </div>
                            <div className="text-[10px] font-bold text-slate-400 text-center leading-tight select-none">音量<br/>標準</div>
                            <div className={`w-12 h-12 md:w-14 md:h-14 rounded-full flex items-center justify-center text-white shadow-lg ${currentVolConfig.color} animate-pulse-slow transition-colors duration-500`}>
                                <Icon component={currentVolConfig.icon} size={24} />
                            </div>
                            <div className={`writing-vertical-lr text-sm md:text-base font-black tracking-widest ${currentVolConfig.textColor} select-none`}>
                                {currentVolConfig.title}
                            </div>
                            <div className="w-full h-px bg-slate-200 my-1"></div>
                            <div className="flex flex-col gap-2 w-full items-center">
                                {volumeLevels.map(v => (
                                    <button key={v.id} onClick={() => setCurrentLevel(v.id)} className={`w-8 h-8 md:w-10 md:h-10 rounded-full flex items-center justify-center transition-all duration-200 ${currentLevel === v.id ? `${v.color} text-white ring-2 ring-offset-2 ring-slate-300 scale-110 shadow-md` : 'bg-slate-100 text-slate-400 hover:bg-slate-200 hover:scale-105'}`} title={v.title}>
                                        <Icon component={v.btnIcon} size={16} />
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>
                    )}

                    {/* Main Content */}
                    <main className="flex-1 p-4 max-w-7xl mx-auto w-full space-y-6">
                        {}
                        {currentTab === 'dashboard' && (
                            <div className="animate-slide-up space-y-6">
                                {moduleConfig.quickTools && (
                                <div className="flex gap-2 overflow-x-auto pb-2 no-scrollbar">
                                    <button onClick={() => applyScoreToAll(1, '全班加分 (+1)')} className="flex items-center gap-1 px-3 py-1.5 bg-emerald-100 text-emerald-700 rounded-lg text-sm font-bold whitespace-nowrap hover:bg-emerald-200"><Icon component={Icons.Plus} size={14}/> 全班+1</button>
                                    <button onClick={() => applyScoreToAll(3, '全班加分 (+3)')} className="flex items-center gap-1 px-3 py-1.5 bg-emerald-100 text-emerald-700 rounded-lg text-sm font-bold whitespace-nowrap hover:bg-emerald-200"><Icon component={Icons.Plus} size={14}/> 全班+3</button>
                                    <button onClick={() => {setShowPicker(true); startPicker();}} className="flex items-center gap-1 px-3 py-1.5 bg-indigo-100 text-indigo-700 rounded-lg text-sm font-bold whitespace-nowrap hover:bg-indigo-200"><Icon component={Icons.Dices} size={14}/> 幸運抽籤</button>
                                </div>
                                )}

                                {moduleConfig.timer && (
                                <div className="w-full max-w-4xl mx-auto">
                                    <div className={`p-6 rounded-3xl shadow-sm border-2 transition-all duration-300 flex flex-col justify-between ${isTimeUp ? 'bg-red-50 border-red-400 animate-pulse-slow' : 'bg-white border-slate-100'}`}>
                                        <div className="flex justify-between items-center mb-4">
                                            <div className="flex items-center gap-2 font-bold text-slate-500 text-lg"><Icon component={Icons.Timer} size={24} /> 倒數計時</div>
                                            <button onClick={() => setIsMuted(!isMuted)} className="text-slate-400 hover:text-blue-500 p-2 hover:bg-slate-50 rounded-full transition-colors">{isMuted ? <Icon component={Icons.BellOff} size={24}/> : <Icon component={Icons.Bell} size={24}/>}</button>
                                        </div>
                                        <div className="flex flex-col items-center justify-center py-4">
                                            <div className={`text-8xl md:text-9xl font-mono font-black tracking-tighter ${isTimeUp ? 'text-red-600' : isActive ? 'text-blue-600' : 'text-slate-700'}`}>
                                                {formatTime(timeLeft)}
                                            </div>
                                            <div className="flex gap-4 mt-8 w-full max-w-md">
                                                <button onClick={() => isTimeUp ? (setIsTimeUp(false), setTimeLeft(initialTime)) : setIsActive(!isActive)} className={`flex-1 py-4 rounded-2xl font-bold text-xl text-white shadow-lg active:scale-95 transition-transform ${isTimeUp ? 'bg-blue-500' : isActive ? 'bg-amber-400' : 'bg-blue-600'}`}>
                                                    {isTimeUp ? '重置' : isActive ? '暫停' : '開始'}
                                                </button>
                                                <div className="flex items-center bg-slate-100 rounded-2xl px-3 w-1/3">
                                                    <input type="number" placeholder="分" className="w-full bg-transparent text-center font-bold text-xl outline-none" value={customTimeInput} onChange={(e) => setCustomTimeInput(e.target.value)} />
                                                    <button onClick={handleCustomTimer} className="text-blue-600 hover:bg-blue-200 p-2 rounded-xl font-bold text-sm">設定</button>
                                                </div>
                                            </div>

                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 寵物詳情 Modal */}
                    {petDetailId !== null && (() => {
                        const s = studentData.find(x => x.id === petDetailId);
                        if (!s) return null;
                        const lineId = petAssignments[s.id] || 0;
                        if (lineId === 0) {
                            return (
                                <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-[80] flex items-center justify-center p-4" onClick={() => setPetDetailId(null)}>
                                    <div className="bg-white rounded-3xl w-full max-w-md overflow-hidden shadow-2xl animate-pop" onClick={(e) => e.stopPropagation()}>
                                        <div className="p-4 text-white flex justify-between items-center bg-gradient-to-r from-slate-400 to-slate-500">
                                            <h3 className="font-bold">{s.id}號 {s.name} 的寵物</h3>
                                            <button onClick={() => setPetDetailId(null)} className="hover:opacity-70"><Icon component={Icons.X}/></button>
                                        </div>
                                        <div className="p-6 flex flex-col items-center">
                                            <div className="w-36 h-36 mb-4 flex items-center justify-center rounded-2xl bg-slate-50 border-2 border-dashed border-slate-200">
                                                <span className="text-7xl">🥚</span>
                                            </div>
                                            <div className="text-lg font-black text-slate-400 mb-2">尚未抽取寵物</div>
                                            <div className="text-sm text-slate-400 text-center">讓 {s.name} 掃 QR Code，花 5 點來抽取初始寵物吧！</div>
                                        </div>
                                    </div>
                                </div>
                            );
                        }
                        const fam = getEffectivePetFamily(lineId, s.score);
                        const stage = fam.isLegendary ? 0 : getPetStage(s.score);
                        const rawNext = fam.isLegendary ? undefined : PET_THRESHOLDS[stage + 1];
                        const nextThreshold = rawNext ?? (!fam.isLegendary && s.score < LEGENDARY_THRESHOLD ? LEGENDARY_THRESHOLD : undefined);
                        const isMax = fam.isLegendary || nextThreshold === undefined;
                        const imgKey = getPetImgKey(fam.lineId, stage, fam.isLegendary);
                        const petImg = petImages[imgKey];
                        return (
                            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-[80] flex items-center justify-center p-4" onClick={() => setPetDetailId(null)}>
                                <div className="bg-white rounded-3xl w-full max-w-md overflow-hidden shadow-2xl animate-pop" onClick={(e) => e.stopPropagation()}>
                                    <div className={`p-4 text-white flex justify-between items-center ${fam.isLegendary ? 'bg-gradient-to-r from-amber-500 to-yellow-400' : 'bg-gradient-to-r from-rose-500 to-pink-400'}`}>
                                        <h3 className="font-bold flex items-center gap-2">{s.id}號 {s.name} 的寵物</h3>
                                        <button onClick={() => setPetDetailId(null)} className="hover:opacity-70"><Icon component={Icons.X}/></button>
                                    </div>
                                    <div className="p-6 flex flex-col items-center">
                                        {/* 寵物圖片區 */}
                                        <div className={`w-36 h-36 mb-4 flex items-center justify-center rounded-2xl ${fam.isLegendary ? 'bg-gradient-to-br from-amber-50 to-yellow-100 border-2 border-amber-200' : 'bg-gradient-to-br from-rose-50 to-pink-100 border-2 border-rose-100'}`}>
                                            {petImg
                                                ? <img src={petImg} alt={fam.names[stage]} className="w-full h-full object-contain p-2" style={{filter:'drop-shadow(0 6px 10px rgba(0,0,0,0.2))'}} />
                                                : <span className="text-8xl select-none" style={{filter:'drop-shadow(0 6px 8px rgba(0,0,0,0.15))'}}>{fam.emoji[stage]}</span>
                                            }
                                        </div>
                                        <input type="text" value={petNames[s.id] || ""} onChange={(e) => setPetNames({ ...petNames, [s.id]: e.target.value })} placeholder={fam.names[stage]} className={`text-center font-black text-xl bg-transparent border-b-2 border-dashed outline-none mb-2 ${fam.isLegendary ? 'text-amber-700 border-amber-200 focus:border-amber-500' : 'text-rose-700 border-rose-200 focus:border-rose-500'}`} />
                                        <div className="flex items-center gap-2 mb-4">
                                            <span className={`text-xs font-bold px-2 py-0.5 rounded ${getPetTypeColor(fam.type)}`}>{fam.type}</span>
                                            {fam.isLegendary
                                                ? <span className="text-xs font-bold px-2 py-0.5 rounded bg-amber-100 text-amber-700">★ 傳說寵物</span>
                                                : <span className="text-xs font-bold px-2 py-0.5 rounded bg-slate-100 text-slate-600">{['幼年體','中階體','最終體'][stage]}</span>
                                            }
                                            <span className="text-xs font-bold px-2 py-0.5 rounded bg-slate-100 text-slate-600">目前 {s.score} 分</span>
                                        </div>
                                        {!fam.isLegendary && (
                                            <div className="w-full bg-slate-50 rounded-2xl border border-slate-200 p-3 mb-4">
                                                <div className="text-xs font-bold text-slate-400 mb-2 text-center">進化鏈</div>
                                                <div className="flex items-center justify-center gap-2">
                                                    {fam.emoji.map((e, i) => {
                                                        const stgKey = getPetImgKey(fam.lineId, i, false);
                                                        const stgImg = petImages[stgKey];
                                                        return (
                                                            <React.Fragment key={i}>
                                                                {i > 0 && <span className="text-slate-300">→</span>}
                                                                <div className={`flex flex-col items-center ${i === stage ? '' : 'opacity-40'}`}>
                                                                    {stgImg
                                                                        ? <img src={stgImg} alt={fam.names[i]} className={`object-contain ${i === stage ? 'w-10 h-10' : 'w-8 h-8'}`} />
                                                                        : <span className={`${i === stage ? 'text-3xl scale-110' : 'text-2xl'}`}>{e}</span>
                                                                    }
                                                                    <span className="text-[10px] font-bold text-slate-500 mt-1">{fam.names[i]}</span>
                                                                </div>
                                                            </React.Fragment>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        )}
                                        <p className="text-sm text-slate-500 leading-relaxed text-center mb-3">{fam.desc}</p>
                                        <div className={`w-full text-center text-sm font-bold rounded-xl py-2 ${isMax ? 'bg-amber-50 text-amber-600' : 'bg-rose-50 text-rose-600'}`}>
                                            {fam.isLegendary ? '✨ 傳說寵物，全班最稀有！' : isMax ? '✨ 已完全進化，最強型態！' : nextThreshold === LEGENDARY_THRESHOLD ? `✨ 再得 ${nextThreshold - s.score} 分就會升格傳說型態！` : `再得 ${nextThreshold - s.score} 分就會進化成「${fam.names[stage + 1]}」`}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        );
                    })()}

                    {/* 通知訊息 */}
                    {dailyUpdateMsg && (
                        <div className="fixed top-20 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full shadow-xl z-[70] animate-slide-up flex items-center gap-3 text-sm font-bold whitespace-pre-line text-center border border-slate-600">
                            <Icon component={Icons.Sparkles} className="text-yellow-400"/> {dailyUpdateMsg}
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
