<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2B1D0E">
<title>我的寵物夥伴</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  body {
    font-family: 'Noto Sans TC', system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
    background: radial-gradient(ellipse at 50% 30%, #4A3318 0%, #2B1D0E 65%, #1C1206 100%);
    min-height: 100vh;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pop { 0%{transform:scale(0.5);opacity:0} 70%{transform:scale(1.06)} 100%{transform:scale(1);opacity:1} }
  @keyframes shakeHard {
    0%,100%{transform:rotate(0)} 15%{transform:rotate(-4deg)} 30%{transform:rotate(4deg)}
    45%{transform:rotate(-5deg)} 60%{transform:rotate(5deg)} 75%{transform:rotate(-3deg)} 90%{transform:rotate(3deg)}
  }
  @keyframes floaty { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  @keyframes shine { from{background-position:-200% 0} to{background-position:200% 0} }
  @keyframes twinkle { 0%,100%{opacity:0.25} 50%{opacity:1} }
  .animate-pop { animation: pop 0.5s cubic-bezier(.34,1.56,.64,1) forwards; }
  .animate-floaty { animation: floaty 2.4s ease-in-out infinite; }
  .shaking { animation: shakeHard 1s ease-in-out; }

  .card-frame {
    background: linear-gradient(165deg, #F8ECD0 0%, #EFDCAE 100%);
    border-radius: 20px;
    border: 3px solid #C9A227;
    box-shadow: 0 0 0 3px #4A3318, 0 0 0 5px #8A6A14, 0 18px 45px rgba(0,0,0,.55), inset 0 0 35px rgba(170,130,50,.22);
    position: relative;
  }
  .card-frame.legendary {
    background: linear-gradient(165deg, #FFF3CF 0%, #F4DC96 100%);
    border-color: #E8B923;
    box-shadow: 0 0 0 3px #4A3318, 0 0 0 5px #C9A227, 0 0 28px rgba(232,185,35,.5), 0 18px 45px rgba(0,0,0,.55), inset 0 0 35px rgba(200,150,40,.3);
  }
  .corner { position: absolute; color: #B08A1E; font-size: 14px; line-height: 1; pointer-events: none; }

  .ribbon {
    background: linear-gradient(90deg, #8A6A14, #C9A227 30%, #E8C84A 50%, #C9A227 70%, #8A6A14);
    border: 1.5px solid #5C430C;
    color: #FFF7E0;
    text-shadow: 0 1px 2px rgba(60,40,0,.6);
  }
  .art-box {
    background: radial-gradient(circle at 50% 38%, #FFFDF4 0%, #F7EBCB 75%);
    border: 2px solid #C9A227;
    box-shadow: inset 0 0 0 3px #F8ECD0, inset 0 0 0 4px #D9BC6A, inset 0 4px 14px rgba(150,110,30,.25);
  }
  .holo { position: relative; overflow: hidden; }
  .holo::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(110deg, transparent 32%, rgba(255,255,255,.55) 50%, transparent 68%);
    background-size: 220% 100%;
    animation: shine 2.6s linear infinite;
    pointer-events: none;
  }
  .gold-btn {
    background: linear-gradient(180deg, #F0D060, #C9A227);
    border: 2px solid #8A6A14;
    box-shadow: 0 5px 0 #8A6A14, 0 8px 16px rgba(0,0,0,.35);
    color: #2B1D0E;
    transition: all .15s ease;
  }
  .gold-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #8A6A14; }
  .card-back-face {
    background:
      radial-gradient(circle at 50% 45%, rgba(232,200,74,.18) 0%, transparent 55%),
      repeating-linear-gradient(45deg, #33240F 0 10px, #2B1D0E 10px 20px);
    border-radius: 20px;
    border: 3px solid #C9A227;
    box-shadow: 0 0 0 3px #4A3318, 0 0 0 5px #8A6A14, 0 18px 45px rgba(0,0,0,.55);
  }
  .flip-scene { perspective: 1100px; }
  .flip-card { transform-style: preserve-3d; transition: transform .85s cubic-bezier(.45,0,.2,1); position: relative; }
  .flip-card.flipped { transform: rotateY(180deg); }
  .face { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .front-face { transform: rotateY(180deg); position: absolute; inset: 0; }
  .star { position: fixed; color: #E8C84A; animation: twinkle 3s ease-in-out infinite; pointer-events: none; }
  .progress-track { background: #D9C28F; box-shadow: inset 0 2px 4px rgba(110,80,20,.45); }
  .progress-fill { background: linear-gradient(90deg, #C9A227, #E8C84A); box-shadow: 0 0 8px rgba(232,200,74,.6); }
</style>
</head>
<body class="flex items-center justify-center p-4">

<span class="star text-xs" style="top:8%;left:12%">✦</span>
<span class="star text-sm" style="top:15%;right:10%;animation-delay:.8s">✦</span>
<span class="star text-xs" style="bottom:18%;left:8%;animation-delay:1.5s">✦</span>
<span class="star text-sm" style="bottom:10%;right:14%;animation-delay:2.2s">✦</span>

<div id="app" class="w-full max-w-sm">
  <div id="loading" class="text-center py-16">
    <div class="w-12 h-12 border-4 border-[#C9A227] border-t-transparent rounded-full mx-auto mb-4" style="animation:spin 1s linear infinite"></div>
    <div class="text-[#E8C84A] font-bold tracking-widest">召喚陣啟動中…</div>
  </div>
</div>

<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDtgJnhqUIOPPcWoZfADmqUcBHVWiIEFkU",
  authDomain: "zheteacher.firebaseapp.com",
  projectId: "zheteacher",
  storageBucket: "zheteacher.firebasestorage.app",
  messagingSenderId: "255808976602",
  appId: "1:255808976602:web:168dcff4cffb0d68a657e3"
};

const THRESHOLDS = [0, 150, 300];
const LEGENDARY_THRESHOLD = 450;

const FAMILIES = [
  {id:1,  names:['芽芽鼠','葉葉狐','森靈王'],   type:'草',      emoji:'🌱'},
  {id:2,  names:['火苗喵','焰焰獅','炎王獸'],   type:'火',      emoji:'🔥'},
  {id:3,  names:['水珠龜','浪潮龜','海皇龜'],   type:'水',      emoji:'💧'},
  {id:4,  names:['電電鼠','雷頰鼠','雷神鼠'],   type:'電',      emoji:'⚡'},
  {id:5,  names:['葉葉蟲','搖搖繭','霓彩蝶'],   type:'蟲',      emoji:'🐛'},
  {id:6,  names:['羽羽雀','疾風鷹','蒼穹鵬'],   type:'飛行',    emoji:'🐤'},
  {id:7,  names:['燭火靈','提燈鬼','冥府王'],   type:'幽靈',    emoji:'👻'},
  {id:8,  names:['石石龜','岩甲獸','山岳神'],   type:'岩石',    emoji:'🪨'},
  {id:9,  names:['雪雪兔','冰晶狼','霜華王'],   type:'冰',      emoji:'❄️'},
  {id:10, names:['幼幼龍','翔翔龍','帝王龍'],   type:'龍',      emoji:'🥚'},
  {id:11, names:['花精靈','蝶妖精','百花后'],   type:'妖精',    emoji:'🧚'},
  {id:12, names:['拳拳袋','鬥士猴','霸拳王'],   type:'格鬥',    emoji:'🥊'},
  {id:13, names:['毒牙蛇','沼毒蛇','毒皇蛇'],   type:'毒',      emoji:'🐍'},
  {id:14, names:['沙沙鼹','土盾犰狳','大地守衛'], type:'地面',   emoji:'🐾'},
  {id:15, names:['念念貓','念力師','宇宙超尊'], type:'超能力',  emoji:'🐱'},
  {id:16, names:['鐵皮甲蟲','鋼鐵輪','巨型要塞'], type:'鋼鐵',  emoji:'⚙️'},
  {id:17, names:['小焰馬','烈焰馬','炎帝馬'],   type:'火',      emoji:'🐴'},
  {id:18, names:['毛毛熊','大懶熊','超級巨熊'], type:'一般',    emoji:'🐾'},
  {id:19, names:['浮水雛','浪花鴨','海天霸鵬'], type:'水/飛',   emoji:'🐥'},
  {id:20, names:['焰羽雛','熱炎鷹','烈焰火鳳'], type:'火/飛',   emoji:'🐦'},
  {id:21, names:['花苞獸','毒蘭獸','百毒花皇'], type:'草/毒',   emoji:'🌱'},
  {id:22, names:['磁力球','電磁怪','超電導神'], type:'電/鋼',   emoji:'🔋'},
  {id:23, names:['小海豹','冰川海象','極寒霸主'], type:'水/冰',  emoji:'🦭'},
  {id:24, names:['影龍蛋','暗翼龍','終焉魔龍'], type:'龍/惡',   emoji:'🥚'},
  {id:25, names:['小獨角仙','大角甲蟲','破天甲神'], type:'蟲/格鬥', emoji:'🪲'},
  {id:26, names:['化石蛋','翼龍仔','遠古天霸'], type:'岩石/飛', emoji:'🥚'},
  {id:27, names:['燈火靈','魂炎燈','奪魂神燈'], type:'幽靈/火', emoji:'🏮'},
  {id:28, names:['雪球龍蛋','霜翼龍','極寒神龍'], type:'冰/龍', emoji:'❄️'},
  {id:29, names:['銅拳兵','鐵甲騎士','聖盾守衛'], type:'格鬥/鋼', emoji:'🛡️'},
  {id:30, names:['夢境小貘','催眠貘','夢魘魔尊'], type:'超能力/妖精', emoji:'💤'},
];
const LEGENDARIES = [
  {id:31, name:'創世神龍',  type:'龍/妖精', emoji:'👑'},
  {id:32, name:'終界魔龍',  type:'龍/惡',   emoji:'😈'},
  {id:33, name:'烈陽火鳳',  type:'火/超能力', emoji:'☀️'},
  {id:34, name:'皎月白狼',  type:'冰/妖精', emoji:'🌙'},
  {id:35, name:'深海魔皇',  type:'水/鋼',   emoji:'🌊'},
  {id:36, name:'大地神牛',  type:'地面/格鬥', emoji:'🐂'},
];

function getStage(score) {
  if (score >= THRESHOLDS[2]) return 2;
  if (score >= THRESHOLDS[1]) return 1;
  return 0;
}
function getFamily(lineId) {
  if (lineId >= 31) return null;
  return FAMILIES.find(f => f.id === lineId) || null;
}
function getLegendary(lineId) {
  return LEGENDARIES.find(f => f.id === lineId) || null;
}
function getEffectiveFamily(lineId, score) {
  if (lineId >= 31) return { legendary: getLegendary(lineId) };
  const fam = getFamily(lineId);
  if (!fam) return null;
  if (score >= LEGENDARY_THRESHOLD) {
    return { legendary: getLegendary(31 + ((fam.id - 1) % 6)) };
  }
  return { fam };
}
function imgSrc(lineId, stage, isLeg) {
  const base = 'assets/pets/';
  return isLeg ? `${base}pet_${lineId}_l.png` : `${base}pet_${lineId}_${stage}.png`;
}

firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();
const db = firebase.firestore();
const params = new URLSearchParams(location.search);
const STUDENT_ID = parseInt(params.get('id')) || 0;
const PORTAL_DOC = db.collection('portal').doc('class502');

let currentStudent = null;
let unsubscribe = null;
let suppressRender = false;
let hasRendered = false;

auth.signInAnonymously()
  .then(() => listenPortal())
  .catch(e => showError('登入失敗：' + e.message));

function listenPortal() {
  unsubscribe = PORTAL_DOC.onSnapshot(snap => {
    if (!snap.exists) { showError('老師還沒有開啟同步，請告訴老師按「同步學生頁」！'); return; }
    const data = snap.data();
    const s = (data.students || []).find(s => s.id === STUDENT_ID);
    if (!s) { showError(`找不到 ${STUDENT_ID} 號學生，請確認 QR 碼正確。`); return; }
    currentStudent = s;
    if (!suppressRender) renderPage(s);
  }, e => showError('讀取失敗：' + e.message));
}

function headerHTML(s) {
  return `
    <div class="text-center mb-4">
      <div class="text-[#C9A227] text-[11px] font-bold tracking-[0.35em] mb-1">五年二班 · 冒險者</div>
      <div class="text-[#FFF7E0] text-2xl font-black" style="text-shadow:0 2px 6px rgba(0,0,0,.5)">${s.name} <span class="text-sm font-bold text-[#D9BC6A]">${s.id} 號</span></div>
      <div class="inline-flex items-center gap-1.5 mt-2 bg-[#1C1206] border border-[#8A6A14] rounded-full px-4 py-1.5 text-[#E8C84A] font-black text-sm shadow-lg">
        🪙 ${s.score} 分
      </div>
    </div>`;
}

function cornersHTML() {
  return `
    <span class="corner" style="top:8px;left:10px">✦</span>
    <span class="corner" style="top:8px;right:10px">✦</span>
    <span class="corner" style="bottom:8px;left:10px">✦</span>
    <span class="corner" style="bottom:8px;right:10px">✦</span>`;
}

function renderPage(s) {
  const app = document.getElementById('app');
  const lineId = s.petLineId || 0;
  const animClass = hasRendered ? '' : 'animate-pop';
  hasRendered = true;

  if (lineId === 0) {
    const canDraw = s.score >= 5;
    app.innerHTML = `
      ${headerHTML(s)}
      <div class="card-back-face p-6 ${animClass}">
        ${cornersHTML()}
        <div class="flex flex-col items-center py-4">
          <div class="w-24 h-24 rounded-full border-2 border-[#C9A227] bg-[#1C1206] flex items-center justify-center mb-4 animate-floaty" style="box-shadow:0 0 24px rgba(232,200,74,.35)">
            <span class="text-5xl select-none">🥚</span>
          </div>
          <div class="text-[#E8C84A] text-xl font-black mb-1">未知的夥伴沉睡中</div>
          <div class="text-[#B89B5A] text-sm font-bold mb-6 text-center">支付 5 分召喚費，喚醒你的初始夥伴！</div>
          ${canDraw
            ? `<button id="drawBtn" onclick="drawPet()" class="gold-btn w-full py-4 rounded-2xl font-black text-lg cursor-pointer">⚔ 召喚夥伴（花費 5 分）</button>`
            : `<div class="w-full py-4 rounded-2xl bg-[#3A2A12] border-2 border-[#5C430C] text-[#8A7A54] font-bold text-center">🔒 還差 ${5 - s.score} 分才能召喚</div>`
          }
        </div>
      </div>`;
    return;
  }

  const eff = getEffectiveFamily(lineId, s.score);
  if (!eff) { showError('寵物資料錯誤'); return; }

  if (eff.legendary) {
    const leg = eff.legendary;
    const src = imgSrc(leg.id, 0, true);
    app.innerHTML = `
      ${headerHTML(s)}
      <div class="card-frame legendary p-5 ${animClass}">
        ${cornersHTML()}
        <div class="flex justify-center -mt-9 mb-3">
          <div class="ribbon rounded-full px-5 py-1 text-sm font-black tracking-[0.25em]">★ 傳說 · ${leg.type} ★</div>
        </div>
        <div class="art-box holo rounded-xl w-44 h-44 mx-auto flex items-center justify-center mb-4">
          <img src="${src}" alt="${leg.name}" class="w-full h-full object-contain p-3 animate-floaty" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
          <span class="text-7xl hidden">${leg.emoji}</span>
        </div>
        <div class="text-center text-2xl font-black text-[#6B4E08] mb-1" style="text-shadow:0 1px 0 #FFF3CF">${leg.name}</div>
        <div class="text-center text-xs font-bold text-[#8A6A14] tracking-widest mb-4">最終傳說型態</div>
        <div class="rounded-xl border border-[#C9A227] bg-[#FFF7E0] py-2.5 px-3 text-center text-sm font-black text-[#8A6A14]">
          ✨ 傳說降臨，全班最稀有的存在！
        </div>
      </div>`;
    return;
  }

  const fam = eff.fam;
  const stage = getStage(s.score);
  const rawNext = THRESHOLDS[stage + 1];
  const nextThreshold = rawNext ?? (s.score < LEGENDARY_THRESHOLD ? LEGENDARY_THRESHOLD : undefined);
  const isMax = nextThreshold === undefined;
  const base = THRESHOLDS[stage] || 0;
  const progress = isMax ? 100 : Math.min(100, Math.round(((s.score - base) / (nextThreshold - base)) * 100));
  const src = imgSrc(fam.id, stage, false);
  const nextMsg = isMax
    ? '✨ 已完全進化，最強型態！'
    : nextThreshold === LEGENDARY_THRESHOLD
      ? `再得 ${nextThreshold - s.score} 分，升格傳說型態！`
      : `再得 ${nextThreshold - s.score} 分，進化成「${fam.names[stage + 1]}」`;

  const evolutionSection = s.isFree === false
    ? `<div class="flex items-center justify-center gap-1.5 mb-4">
        ${fam.names.map((n, i) => `
          ${i > 0 ? '<span class="text-[#B08A1E] text-xs font-black">➤</span>' : ''}
          <div class="flex flex-col items-center">
            <div class="w-12 h-12 rounded-lg flex items-center justify-center bg-[#E8D5A8] border border-[#C9B070] opacity-35">
              <img src="${imgSrc(fam.id, i, false)}" alt="${n}" class="w-10 h-10 object-contain grayscale" onerror="this.style.display='none'">
            </div>
            <span class="text-[10px] font-bold text-[#A08A50] mt-1">${n}</span>
          </div>`).join('')}
       </div>
       <div class="rounded-xl border-2 border-[#5C430C] bg-[#3A2808] py-3 px-3 text-center font-black text-[#D4A010]">
         🔒 成為自由之身才能進化
       </div>`
    : `<div class="mb-1 flex justify-between text-[11px] font-black text-[#8A6A14]">
        <span>進化之路</span><span>${progress}%</span>
       </div>
       <div class="progress-track w-full rounded-full h-3 mb-4 overflow-hidden">
         <div class="progress-fill h-full rounded-full" style="width:${progress}%"></div>
       </div>
       <div class="flex items-center justify-center gap-1.5 mb-4">
        ${fam.names.map((n, i) => `
          ${i > 0 ? '<span class="text-[#B08A1E] text-xs font-black">➤</span>' : ''}
          <div class="flex flex-col items-center">
            <div class="w-12 h-12 rounded-lg flex items-center justify-center ${i === stage ? 'bg-[#FFF7E0] border-2 border-[#C9A227]' : 'bg-[#E8D5A8] border border-[#C9B070] opacity-45'}" ${i === stage ? 'style="box-shadow:0 0 10px rgba(201,162,39,.5)"' : ''}>
              <img src="${imgSrc(fam.id, i, false)}" alt="${n}" class="w-10 h-10 object-contain ${i > stage ? 'grayscale' : ''}" onerror="this.style.display='none'">
            </div>
            <span class="text-[10px] font-bold ${i === stage ? 'text-[#5C430C]' : 'text-[#A08A50]'} mt-1">${n}</span>
          </div>`).join('')}
       </div>
       <div class="rounded-xl border border-[#C9A227] bg-[#FFF7E0] py-2.5 px-3 text-center text-sm font-black text-[#8A6A14]">
         ${nextMsg}
       </div>`;

  app.innerHTML = `
    ${headerHTML(s)}
    <div class="card-frame p-5 ${animClass}">
      ${cornersHTML()}
      <div class="flex justify-center -mt-9 mb-3">
        <div class="ribbon rounded-full px-5 py-1 text-sm font-black tracking-[0.25em]">★ ${fam.type} 系 ★</div>
      </div>
      <div class="art-box rounded-xl w-44 h-44 mx-auto flex items-center justify-center mb-3">
        <img src="${src}" alt="${fam.names[stage]}" class="w-full h-full object-contain p-3 animate-floaty" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
        <span class="text-7xl hidden">${fam.emoji}</span>
      </div>
      <div class="text-center text-2xl font-black text-[#5C430C] mb-1" style="text-shadow:0 1px 0 #F8ECD0">${fam.names[stage]}</div>
      <div class="text-center mb-4">
        <span class="inline-block text-[11px] font-black px-3 py-0.5 rounded-full bg-[#5C430C] text-[#F0D060] tracking-widest">${['幼年體','中階體','最終體'][stage]}</span>
      </div>
      ${evolutionSection}
    </div>`;
}

async function drawPet() {
  const btn = document.getElementById('drawBtn');
  if (!btn) return;
  btn.disabled = true;
  btn.textContent = '召喚陣詠唱中…';
  btn.classList.add('opacity-60');

  try {
    let drawnId = 0;
    suppressRender = true;
    await db.runTransaction(async t => {
      const snap = await t.get(PORTAL_DOC);
      if (!snap.exists) throw new Error('資料不存在');
      const data = snap.data();
      const students = [...(data.students || [])];
      const idx = students.findIndex(s => s.id === STUDENT_ID);
      if (idx === -1) throw new Error('找不到學生');
      if (students[idx].score < 5) throw new Error('積分不足');
      if (students[idx].petLineId) throw new Error('已有寵物');
      drawnId = Math.floor(Math.random() * 30) + 1;
      students[idx] = { ...students[idx], score: students[idx].score - 5, petLineId: drawnId };
      t.update(PORTAL_DOC, { students });
    });
    showGacha(drawnId);
  } catch (e) {
    suppressRender = false;
    alert('召喚失敗：' + e.message);
    if (currentStudent) renderPage(currentStudent);
  }
}

function showGacha(lineId) {
  const fam = FAMILIES.find(f => f.id === lineId);
  if (!fam) { suppressRender = false; return; }
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="text-center mb-4">
      <div class="text-[#E8C84A] text-lg font-black tracking-[0.3em]" style="text-shadow:0 0 12px rgba(232,200,74,.6)">召喚中…</div>
    </div>
    <div class="flip-scene">
      <div id="flipCard" class="flip-card shaking" style="height:420px">
        <div class="face card-back-face absolute inset-0 flex flex-col items-center justify-center">
          ${cornersHTML()}
          <div class="w-28 h-28 rounded-full border-2 border-[#C9A227] bg-[#1C1206] flex items-center justify-center" style="box-shadow:0 0 30px rgba(232,200,74,.45)">
            <span class="text-6xl select-none">🥚</span>
          </div>
          <div class="text-[#B89B5A] font-black tracking-[0.4em] mt-6 text-sm">？？？</div>
        </div>
        <div class="face front-face card-frame p-5 flex flex-col items-center justify-center">
          ${cornersHTML()}
          <div class="ribbon rounded-full px-5 py-1 text-sm font-black tracking-[0.25em] mb-4">★ ${fam.type} 系 ★</div>
          <div class="art-box holo rounded-xl w-44 h-44 flex items-center justify-center mb-4">
            <img src="${imgSrc(fam.id, 0, false)}" alt="${fam.names[0]}" class="w-full h-full object-contain p-3" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
            <span class="text-7xl hidden">${fam.emoji}</span>
          </div>
          <div class="text-2xl font-black text-[#5C430C]" style="text-shadow:0 1px 0 #F8ECD0">${fam.names[0]}</div>
          <div class="text-sm font-black text-[#8A6A14] mt-1 mb-3">✨ 召喚成功！</div>
          <div class="text-[11px] font-bold text-[#A08A50]">（已扣除 5 分召喚費）</div>
        </div>
      </div>
    </div>`;

  const card = document.getElementById('flipCard');
  setTimeout(() => card.classList.add('flipped'), 1150);
  setTimeout(() => {
    suppressRender = false;
    hasRendered = false;
    if (currentStudent) renderPage(currentStudent);
  }, 5000);
}

function showError(msg) {
  document.getElementById('app').innerHTML = `
    <div class="card-frame p-8 text-center animate-pop">
      ${cornersHTML()}
      <div class="text-5xl mb-4">📜</div>
      <div class="text-[#5C430C] font-black">${msg}</div>
    </div>`;
}
</script>
</body>
</html>
